<section>
    <div class="max-w-6xl mx-auto px-4 relative z-20 py-10 md:py-20">
        <div class="flex items-end justify-between gap-6">
            <div class="space-y-7">
                <div class="text-pgc font-bold special-gothic-expanded-one-regular uppercase text-sm">Testimoniales</div>
                <h2 class="text-3xl md:text-5xl font-bold dark:text-white text-slate-950 w-full md:w-2/3">Historias que respaldan nuestro trabajo</h2>
            </div>
            <div class="hidden md:flex items-center gap-3 shrink-0">
                <button type="button" class="testimonios-prev flex size-12 items-center justify-center rounded-full border border-slate-300/60 bg-white/50 text-slate-800 backdrop-blur-md transition hover:border-pgc hover:bg-pgc hover:text-slate-950 disabled:pointer-events-none disabled:opacity-40 dark:border-white/10 dark:bg-white/5 dark:text-white" aria-label="Testimonio anterior">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
                </button>
                <button type="button" class="testimonios-next flex size-12 items-center justify-center rounded-full border border-slate-300/60 bg-white/50 text-slate-800 backdrop-blur-md transition hover:border-pgc hover:bg-pgc hover:text-slate-950 disabled:pointer-events-none disabled:opacity-40 dark:border-white/10 dark:bg-white/5 dark:text-white" aria-label="Siguiente testimonio">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg>
                </button>
            </div>
        </div>
        <div class="swiper mySwiper mt-4">
            <div class="swiper-wrapper">
                {{ testimoniales }}
                    {{ testimonial }}
                    <div class="swiper-slide !h-auto pt-10 md:pt-14">
                        <div class="relative flex h-full flex-col gap-6 rounded-2xl border border-slate-300/50 bg-white/50 p-8 shadow-sm backdrop-blur-md dark:border-white/10 dark:bg-white/5 md:p-10">
                            <div class="absolute -top-7 left-8 z-30 flex size-14 items-center justify-center rounded-full bg-pgc shadow-md">
                                <img class="size-7" src="/assets/quotation.svg" alt="Icono de comillas">
                            </div>
                            <div class="flex-1 pt-4 text-lg font-light leading-relaxed">{{ texto_de_testimonial }}</div>
                            <div class="border-t border-slate-300/60 pt-5 dark:border-white/10">
                                <div class="font-bold special-gothic-expanded-one-regular">{{ nombre }}</div>
                                <div class="text-sm text-slate-600 dark:text-slate-400">{{ empresa }}</div>
                            </div>
                        </div>
                    </div>
                    {{ /testimonial }}
                {{ /testimoniales }}
            </div>
            <div class="swiper-pagination !static mt-8 flex items-center justify-center"></div>
        </div>
    </div>
</section>
